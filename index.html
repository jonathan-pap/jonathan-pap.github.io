<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TechBlog • Articles</title>

  <link rel="stylesheet" href="./assets/css/styles.css?v=12" />
</head>

<body>
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="./index.html" aria-label="TechBlog">
        <span class="brand-badge">TP</span>
        <span class="brand-name">Tech<span class="brand-accent">Blog</span></span>
      </a>

      <nav class="navlinks" aria-label="Primary">
        <a class="navlink active" href="./index.html">Articles</a>
        <a class="navlink" href="./about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="page" id="articles">
    <div class="layout">

      <!-- LEFT SIDEBAR -->
      <aside class="sidebar">

        <!-- Archive -->
        <section class="panel">
          <div class="panel-title">Archive</div>
          <div id="archiveList" class="archive"></div>
        </section>

        <!-- Categories -->
        <section class="panel">
          <div class="panel-title">Categories</div>
          <div id="categoriesList" class="list"></div>
        </section>

        <!-- Popular Tags -->
        <section class="panel">
          <div class="panel-title">Popular Tags</div>
          <div id="tagsList" class="tags"></div>
        </section>

      </aside>

      <!-- MAIN CONTENT -->
      <section class="content">

        <div class="content-head">
          <div>
            <h1 class="content-title">Latest Articles</h1>
          </div>

          <div class="content-meta">
            <span id="articlesCount">0 articles</span>
          </div>
        </div>

        <!-- Filters -->
        <div class="panel" style="padding:14px;">
          <div class="filters">
            <div class="field">
              <div class="field-label">Search</div>
              <input id="searchInput" class="input" placeholder="Title, tag, excerpt…" />
            </div>

            <div class="field">
              <div class="field-label">Tag</div>

              <!-- Custom dropdown -->
              <div class="dd" id="tagDropdown">
                <button class="dd-btn" id="tagBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="dd-value" id="tagValue">All</span>
                  <span class="dd-caret">▾</span>
                </button>
                <div class="dd-menu" id="tagMenu" role="listbox" hidden></div>
              </div>
            </div>
          </div>

          <!-- Active filter chips -->
          <div id="activeFilters" class="chips" aria-label="Active filters"></div>
        </div>

        <!-- Cards -->
        <div id="cardsGrid" class="cards"></div>

        <!-- Footer -->
        <footer class="site-footer">
          <div class="site-footer-wrap">
            <div class="site-footer-top">
              <a class="sf-brand" href="./index.html" aria-label="TechBlog home">
                <span class="sf-badge">TP</span>
                <span class="sf-name">Tech<span class="sf-accent">Blog</span></span>
              </a>

              <div class="sf-links" aria-label="Footer">
                <a class="sf-link" href="./index.html">Articles</a>
                <a class="sf-link" href="./about.html">About</a>
                <a class="sf-link" href="#articles">Back to top</a>
              </div>
            </div>

            <div class="site-footer-bottom">
              <div class="sf-tagline">Insights, tutorials, and patterns — blue to purple.</div>

              <div class="sf-meta">
                <span>© <span id="year"></span> TechBlog</span>
                <span class="sf-sep">•</span>
                <span class="sf-muted">Hosted on GitHub Pages</span>
              </div>
            </div>
          </div>
        </footer>

      </section>
    </div>
  </main>

  <script src="./assets/js/app.js?v=12"></script>
</body>
</html>
