<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TechBlog • Articles</title>

  <link rel="stylesheet" href="./assets/css/styles.css?v=1" />
</head>

<body>
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="./index.html" aria-label="TechBlog">
        <span class="brand-badge">TP</span>
        <span class="brand-name">Tech<span class="brand-accent">Blog</span></span>
      </a>

      <nav class="navlinks" aria-label="Primary">
        <a class="navlink active" href="./index.html">Articles</a>
        <a class="navlink" href="./about.html">About</a>
      </nav>

      <a class="cta" href="#articles">Browse</a>
    </div>
  </header>

  <main class="page" id="articles">
    <div class="layout">
      <aside class="sidebar">
        <section class="panel">
          <div class="panel-title">Categories</div>
          <div id="categories" class="list"></div>
        </section>

        <section class="panel">
          <div class="panel-title">Popular Tags</div>
          <div id="tags" class="chips"></div>
        </section>
      </aside>

      <section class="content">
        <div class="content-head">
          <h1 class="content-title">Latest Articles</h1>
          <div class="content-meta"><span id="articleCount">0</span> articles</div>
        </div>

        <div class="filters">
          <label class="field">
            <span class="field-label">Search</span>
            <input id="searchInput" class="input" type="search" placeholder="Title, tag, excerpt…" autocomplete="off" />
          </label>

<div class="field">
  <span class="field-label">Tag</span>

  <div class="dd" id="tagDD">
    <button class="dd-btn" id="tagDDButton" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="dd-value" id="tagDDValue">All</span>
      <span class="dd-caret" aria-hidden="true">▾</span>
    </button>

    <div class="dd-menu" id="tagDDMenu" role="listbox" tabindex="-1" aria-label="Tag filter" hidden>
      <!-- items injected by JS -->
    </div>
  </div>
</div>

        </div>

        <div id="cards" class="cards" aria-live="polite"></div>

        <div id="emptyState" class="empty" hidden>
          <h3>No articles found</h3>
          <p>Clear filters or update <code>content/posts.json</code>.</p>
        </div>

        <section class="panel about">
          <div class="panel-title">About</div>
          <p class="muted">
            Static blog for GitHub Pages. Posts live in <code>content/posts/</code> and are registered in <code>content/posts.json</code>.
          </p>
        </section>

        <footer class="footer">
          <span>© <span id="year"></span> TechBlog</span>
          <span class="dot">•</span>
          <a class="footer-link" href="./content/posts.json" target="_blank" rel="noreferrer">posts.json</a>
        </footer>
      </section>
    </div>
  </main>

  <script src="./assets/js/app.js?v=1"></script>
</body>
</html>
