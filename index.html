<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BluPulse • Articles</title>

  <link rel="stylesheet" href="./assets/css/styles.css?v=44" />
</head>

<body class="page-articles">
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="./index.html" aria-label="BluPulse">
        <span class="brand-badge">BP</span>
        <span class="brand-name">Blu<span class="brand-accent">Pulse</span></span>
      </a>

      <nav class="navlinks" aria-label="Primary">
        <a class="navlink active" href="./index.html">Articles</a>
        <a class="navlink" href="./about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="page" id="articles">
    <div class="layout">

      <!-- LEFT SIDEBAR -->
      <aside class="sidebar">

        <section class="panel">
          <div class="panel-title">Categories</div>
          <div id="categoriesList" class="list"></div>
        </section>

        <section class="panel">
          <div class="panel-title">Popular Tags</div>
          <div id="tagsList" class="sidebar-tags"></div>
        </section>

        <section class="panel">
          <div class="panel-title">Archive</div>
          <div id="archiveList" class="archive-nav"></div>
        </section>

      </aside>

      <!-- MAIN CONTENT -->
      <section class="content">

        <div class="content-head">
          <div>
            <h1 class="content-title">Latest Articles</h1>
          </div>

          <div class="content-meta">
            <span id="articlesCount">0 articles</span>
          </div>
        </div>

        <!-- Active filters -->
        <div id="filtersPanel" class="panel" style="padding:14px;" hidden>
          <div id="activeFilters" class="filterchips" aria-label="Active filters"></div>
        </div>

        <div id="cardsGrid" class="cards"></div>
        <div id="loadMoreWrap" class="loadmore-wrap" hidden>
          <button id="loadMoreBtn" class="loadmore-btn" type="button">Show more articles</button>
        </div>

        <footer class="site-footer">
          <div class="site-footer-wrap">
            <div class="site-footer-top">
              <a class="sf-brand" href="./index.html" aria-label="BluPulse home">
                <span class="sf-badge">BP</span>
                <span class="sf-name">Blu<span class="sf-accent">Pulse</span></span>
              </a>

              <div class="sf-links" aria-label="Footer">
                <a class="sf-link" href="./index.html">Articles</a>
                <a class="sf-link" href="./about.html">About</a>
                <a class="sf-link" href="#articles">Back to top</a>
              </div>
            </div>

            <div class="site-footer-bottom">
              <div class="sf-tagline">Insights, tutorials, and patterns — blue to purple.</div>

              <div class="sf-meta">
                <span>© <span id="year"></span> BluPulse</span>
                <span class="sf-sep">•</span>
                <span class="sf-muted">Hosted on GitHub Pages</span>
              </div>
            </div>
          </div>
        </footer>

      </section>
    </div>
  </main>

  <script src="./assets/js/app.js?v=23"></script>
</body>
</html>
