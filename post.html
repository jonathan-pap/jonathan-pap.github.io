<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Post • BluPulse</title>

  <link rel="stylesheet" href="./assets/css/styles.css?v=47" />
  <script
    src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"
    integrity="sha384-k8o8HikHweyzW55Wd3wl18ovJj6vHVYNQeQbeSM0fxx+0WiH4TcccOG9uz8Xd2JR"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
</head>

<body class="page-post">
  <a class="skip-link" href="#postBody">Skip to article</a>

  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="./index.html" aria-label="BluPulse home">
        <span class="brand-badge">BP</span>
        <span class="brand-name">Blu<span class="brand-accent">Pulse</span></span>
      </a>

      <nav class="navlinks" aria-label="Primary">
        <a class="navlink" href="./index.html">Articles</a>
        <a class="navlink" href="./about.html">About</a>
      </nav>
    </div>
  </header>

  <div class="reading-progress" aria-hidden="true">
    <div id="readingProgressBar" class="reading-progress-bar"></div>
  </div>

  <main class="page page-post-layout">
    <aside id="postTocSection" class="post-toc post-toc--rail" hidden>
      <div class="post-toc-title">On this page</div>
      <nav id="postToc" class="post-toc-list" aria-label="On this page"></nav>
    </aside>

    <section class="post-column">
      <section class="panel post-panel">
        <a class="backlink" href="./index.html#articles">← Back to posts</a>

        <h1 id="postTitle" class="post-title">Loading…</h1>

        <div class="post-meta">
          <span id="postDate"></span>
          <span id="postCategory"></span>
          <span id="postTags"></span>
        </div>
        <div class="post-head-divider" aria-hidden="true"></div>

        <article id="postBody" class="prose post-main"></article>

        <div id="postError" class="empty" hidden>
          <h3>Could not load this post</h3>
          <p id="postErrorMsg">An error occurred.</p>
        </div>
      </section>

      <section id="postNavSection" class="panel post-nav post-nav-section" hidden>
        <div class="post-nav-title">Continue reading</div>
        <div id="postNav" class="post-nav-grid"></div>
      </section>

      <footer class="site-footer post-footer">
        <div class="site-footer-wrap">
          <div class="site-footer-top">
            <a class="sf-brand" href="./index.html" aria-label="BluPulse home">
              <span class="sf-badge">BP</span>
              <span class="sf-name">Blu<span class="sf-accent">Pulse</span></span>
            </a>

            <div class="sf-links" aria-label="Footer">
              <a class="sf-link" href="./index.html">Articles</a>
              <a class="sf-link" href="./about.html">About</a>
              <a class="sf-link" href="./index.html#articles">Back to top</a>
            </div>
          </div>

          <div class="site-footer-bottom">
            <div class="sf-tagline">Insights, tutorials, and patterns — blue to purple.</div>

            <div class="sf-meta">
              <span>© <span id="year"></span> BluPulse</span>
              <span class="sf-sep">•</span>
              <span class="sf-muted">Hosted on GitHub Pages</span>
            </div>
          </div>
        </div>
      </footer>
    </section>
  </main>

  <script src="./assets/js/post.js?v=26"></script>
</body>
</html>
