<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Post • TechBlog</title>

  <link rel="stylesheet" href="./assets/css/styles.css?v=6" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .prose{ line-height: 1.85; color: rgba(255,255,255,0.88); }
    .prose h1,.prose h2,.prose h3{ line-height: 1.25; margin-top: 1.2em; }
    .prose a{ color: rgba(255,255,255,0.92); }
    .prose pre{
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 14px;
      overflow:auto;
    }
    .prose code{
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 2px 6px;
    }
    .post-title{ margin: 0 0 6px; font-size: clamp(24px, 3.2vw, 38px); }
    .post-meta{ color: rgba(255,255,255,0.68); display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 14px; }
    .tagpill{
      display:inline-flex; align-items:center;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.85);
      font-size: 12px; font-weight: 800;
    }
    .backlink{
      display:inline-block; margin-bottom: 10px;
      color: rgba(255,255,255,0.82); text-decoration:none;
      transition: transform 180ms ease, opacity 180ms ease;
    }
    .backlink:hover{ transform: translateX(-2px); opacity: 0.95; }
  </style>
</head>

<body>
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="./index.html" aria-label="TechBlog">
        <span class="brand-badge">TP</span>
        <span class="brand-name">Tech<span class="brand-accent">Blog</span></span>
      </a>

      <nav class="navlinks" aria-label="Primary">
        <a class="navlink" href="./index.html">Articles</a>
        <a class="navlink" href="./about.html">About</a>
      </nav>

      
    </div>
  </header>

  <main class="page">
    <section class="panel" style="max-width: 980px; margin: 0 auto;">
      <a class="backlink" href="./index.html#articles">← Back to posts</a>

      <h1 id="postTitle" class="post-title">Loading…</h1>
      <div class="post-meta">
        <span id="postDate"></span>
        <span id="postCategory"></span>
        <span id="postTags"></span>
      </div>

      <article id="postBody" class="prose"></article>

      <div id="postError" class="empty" hidden>
        <h3>Could not load this post</h3>
        <p id="postErrorMsg">An error occurred.</p>
      </div>

      <!-- Consistent footer -->
      <footer class="site-footer" style="margin-top: 18px;">
        <div class="site-footer-wrap">
          <div class="site-footer-top">
            <a class="sf-brand" href="./index.html" aria-label="TechBlog home">
              <span class="sf-badge">TP</span>
              <span class="sf-name">Tech<span class="sf-accent">Blog</span></span>
            </a>

            <div class="sf-links" aria-label="Footer">
              <a class="sf-link" href="./index.html">Articles</a>
              <a class="sf-link" href="./about.html">About</a>
              <a class="sf-link" href="./index.html#articles">Browse</a>
            </div>
          </div>

          <div class="site-footer-bottom">
            <div class="sf-tagline">Readable posts with fast navigation and a blue→purple aesthetic.</div>

            <div class="sf-meta">
              <span>© <span id="year"></span> TechBlog</span>
              <span class="sf-sep">•</span>
              <span class="sf-muted">Hosted on GitHub Pages</span>
            </div>
          </div>
        </div>
      </footer>

    </section>
  </main>

  <script src="./assets/js/post.js?v=6"></script>
</body>
</html>
