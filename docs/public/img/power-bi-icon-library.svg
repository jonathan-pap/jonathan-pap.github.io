<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Power BI icon library cover">
  <defs>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gA" cx="0.25" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="#0B1030"/>
  <rect width="1200" height="630" fill="url(#gA)"/>
  <rect width="1200" height="630" fill="url(#gB)"/>

  <!-- 5×4 grid of small icon glyphs, varied shapes + colors -->
  <g stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- row 1 -->
    <g transform="translate(140 110)" stroke="#7fd1ff" opacity="0.85">
      <rect x="-22" y="-22" width="44" height="44" rx="6"/>
      <path d="M -10 0 H 10 M 0 -10 V 10"/>
    </g>
    <g transform="translate(280 110)" stroke="#f5a97f" opacity="0.85">
      <circle cx="0" cy="0" r="22"/>
      <circle cx="0" cy="0" r="8" fill="#f5a97f"/>
    </g>
    <g transform="translate(420 110)" stroke="#b6e3a7" opacity="0.85">
      <path d="M 0 -22 L 22 22 H -22 Z"/>
    </g>
    <g transform="translate(560 110)" stroke="#c4b5fd" opacity="0.9">
      <path d="M 0 -22 L 6 -8 L 21 -6 L 10 4 L 13 19 L 0 12 L -13 19 L -10 4 L -21 -6 L -6 -8 Z" fill="#c4b5fd" fill-opacity="0.18"/>
    </g>
    <g transform="translate(700 110)" stroke="#f9d976" opacity="0.85">
      <rect x="-22" y="-22" width="44" height="44" rx="22"/>
      <path d="M -10 -2 L -3 5 L 12 -10"/>
    </g>
    <g transform="translate(840 110)" stroke="#8ab4ff" opacity="0.85">
      <path d="M -22 22 V -10 L 0 -22 L 22 -10 V 22 Z"/>
      <path d="M -8 22 V 6 H 8 V 22"/>
    </g>
    <g transform="translate(980 110)" stroke="#f7c97a" opacity="0.85">
      <path d="M -16 -16 L 16 16 M -16 16 L 16 -16"/>
      <circle cx="0" cy="0" r="22"/>
    </g>
    <g transform="translate(1120 110)" stroke="#a5b4fc" opacity="0.85">
      <path d="M -16 -8 H 16 M -16 0 H 16 M -16 8 H 8"/>
    </g>

    <!-- row 2 -->
    <g transform="translate(140 250)" stroke="#fbb6ce" opacity="0.85">
      <rect x="-22" y="-12" width="44" height="24" rx="6"/>
      <path d="M -8 -2 V 2 M 8 -2 V 2"/>
    </g>
    <g transform="translate(280 250)" stroke="#9ae6b4" opacity="0.85">
      <path d="M -16 6 L -4 -8 L 6 4 L 16 -10"/>
      <path d="M -16 16 H 16"/>
    </g>
    <!-- highlighted center icon — chart bars with brand gradient -->
    <g transform="translate(420 250)">
      <circle cx="0" cy="0" r="56" fill="url(#halo)"/>
      <g stroke="url(#bp)" stroke-width="2.5">
        <rect x="-22" y="-22" width="44" height="44" rx="9"
              fill="rgba(9,12,32,0.6)"/>
        <path d="M -12 8 V -2 M -2 8 V -10 M 8 8 V -6"/>
      </g>
    </g>
    <g transform="translate(560 250)" stroke="#f9d976" opacity="0.85">
      <circle cx="0" cy="-3" r="14"/>
      <path d="M -10 22 C -10 12, 10 12, 10 22"/>
    </g>
    <g transform="translate(700 250)" stroke="#7fd1ff" opacity="0.85">
      <path d="M -18 0 A 18 18 0 1 1 18 0 A 18 18 0 1 1 -18 0"/>
      <path d="M -8 0 H 8 M 0 -8 V 8" stroke-dasharray="3 3"/>
    </g>
    <g transform="translate(840 250)" stroke="#c4b5fd" opacity="0.85">
      <path d="M -20 6 H 20 V 18 H -20 Z"/>
      <path d="M -10 6 V -14 L 10 -14 V 6"/>
    </g>
    <g transform="translate(980 250)" stroke="#b6e3a7" opacity="0.85">
      <path d="M -18 0 L 0 -18 L 18 0 L 0 18 Z"/>
      <circle cx="0" cy="0" r="6"/>
    </g>
    <g transform="translate(1120 250)" stroke="#f5a97f" opacity="0.85">
      <path d="M -8 -16 V 16 M 0 -10 V 16 M 8 -4 V 16"/>
    </g>

    <!-- row 3 -->
    <g transform="translate(140 390)" stroke="#a5b4fc" opacity="0.85">
      <path d="M -16 8 L 0 -10 L 16 8 Z"/>
      <path d="M -8 8 V 18 H 8 V 8"/>
    </g>
    <g transform="translate(280 390)" stroke="#fbb6ce" opacity="0.85">
      <path d="M 0 -22 L 6 -8 L 21 -6 L 10 4 L 13 19 L 0 12 L -13 19 L -10 4 L -21 -6 L -6 -8 Z"/>
    </g>
    <g transform="translate(420 390)" stroke="#9ae6b4" opacity="0.85">
      <circle cx="-8" cy="-8" r="8"/>
      <circle cx="8" cy="-8" r="8"/>
      <path d="M -16 14 C -8 4, 8 4, 16 14"/>
    </g>
    <g transform="translate(560 390)" stroke="#f9d976" opacity="0.85">
      <rect x="-20" y="-14" width="40" height="28" rx="4"/>
      <path d="M -20 -14 L 0 4 L 20 -14"/>
    </g>
    <g transform="translate(700 390)" stroke="#8ab4ff" opacity="0.85">
      <path d="M -18 0 H 18 M 0 -18 V 18"/>
      <circle cx="0" cy="0" r="20"/>
    </g>
    <g transform="translate(840 390)" stroke="#f7c97a" opacity="0.85">
      <path d="M -22 8 L -4 -10 L 4 -2 L 22 -20"/>
      <path d="M 14 -20 H 22 V -12"/>
    </g>
    <g transform="translate(980 390)" stroke="#c4b5fd" opacity="0.85">
      <rect x="-18" y="-18" width="36" height="36" rx="10"/>
      <circle cx="0" cy="0" r="6" fill="#c4b5fd" fill-opacity="0.3"/>
    </g>
    <g transform="translate(1120 390)" stroke="#7fd1ff" opacity="0.85">
      <path d="M -16 -10 L 0 -20 L 16 -10 V 14 H -16 Z"/>
    </g>
  </g>

  <!-- magnifier ring around the highlighted center icon -->
  <g transform="translate(420 250)">
    <circle cx="0" cy="0" r="64" fill="none" stroke="url(#bp)" stroke-width="3"/>
    <line x1="46" y1="46" x2="92" y2="92" stroke="url(#bp)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Title chip lower-left -->
  <g transform="translate(60 540)">
    <rect width="320" height="44" rx="22"
          fill="rgba(9,12,32,0.78)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
    <circle cx="22" cy="22" r="5" fill="url(#bp)"/>
    <text x="40" y="29" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="14" font-weight="700" fill="rgba(255,255,255,0.95)"
          letter-spacing="0.4">Power BI · Iconify picker</text>
  </g>
</svg>
