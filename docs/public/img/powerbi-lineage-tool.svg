<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="PowerBI-Lineage cover">
  <defs>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="#0B1030"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M240 0 V630 M480 0 V630 M720 0 V630 M960 0 V630"/>
  </g>

  <!-- Connector paths: source -> tables -> measures -->
  <g fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round">
    <!-- source to tables -->
    <path d="M 240 315 C 360 315, 380 165, 500 165"/>
    <path d="M 240 315 C 360 315, 380 315, 500 315"/>
    <path d="M 240 315 C 360 315, 380 465, 500 465"/>
    <!-- tables to measures (top table) -->
    <path d="M 660 165 C 780 165, 800 105, 920 105"/>
    <path d="M 660 165 C 780 165, 800 195, 920 195"/>
    <!-- tables to measures (mid table) -->
    <path d="M 660 315 C 780 315, 800 285, 920 285"/>
    <path d="M 660 315 C 780 315, 800 345, 920 345"/>
    <!-- tables to measures (bottom table) -->
    <path d="M 660 465 C 780 465, 800 435, 920 435"/>
    <path d="M 660 465 C 780 465, 800 525, 920 525"/>
  </g>

  <!-- Source node (left) -->
  <g>
    <rect x="120" y="280" width="120" height="70" rx="14"
          fill="url(#bp)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <text x="180" y="320" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Model</text>
    <text x="180" y="338" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="12" font-weight="500" fill="rgba(255,255,255,0.75)" text-anchor="middle">.pbip / .bim</text>
  </g>

  <!-- Tables column -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
     font-size="14" font-weight="600" fill="rgba(255,255,255,0.92)" text-anchor="middle">
    <g>
      <rect x="500" y="135" width="160" height="58" rx="12"
            fill="rgba(255,255,255,0.06)" stroke="rgba(139,92,246,0.55)" stroke-width="1.5"/>
      <text x="580" y="170">Sales</text>
    </g>
    <g>
      <rect x="500" y="285" width="160" height="58" rx="12"
            fill="rgba(255,255,255,0.06)" stroke="rgba(139,92,246,0.55)" stroke-width="1.5"/>
      <text x="580" y="320">Date</text>
    </g>
    <g>
      <rect x="500" y="435" width="160" height="58" rx="12"
            fill="rgba(255,255,255,0.06)" stroke="rgba(139,92,246,0.55)" stroke-width="1.5"/>
      <text x="580" y="470">Customer</text>
    </g>
  </g>

  <!-- Measures column (right) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="13" font-weight="600" fill="rgba(255,255,255,0.86)" text-anchor="start">
    <g>
      <rect x="920" y="78" width="160" height="48" rx="10"
            fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.45)" stroke-width="1.25"/>
      <text x="940" y="106">Total Sales</text>
    </g>
    <g>
      <rect x="920" y="168" width="160" height="48" rx="10"
            fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.45)" stroke-width="1.25"/>
      <text x="940" y="196">Sales YoY %</text>
    </g>
    <g>
      <rect x="920" y="258" width="160" height="48" rx="10"
            fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.45)" stroke-width="1.25"/>
      <text x="940" y="286">Days Open</text>
    </g>
    <g>
      <rect x="920" y="318" width="160" height="48" rx="10"
            fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.45)" stroke-width="1.25"/>
      <text x="940" y="346">Period MTD</text>
    </g>
    <g>
      <rect x="920" y="408" width="160" height="48" rx="10"
            fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.45)" stroke-width="1.25"/>
      <text x="940" y="436">Active Cust</text>
    </g>
    <g>
      <rect x="920" y="498" width="160" height="48" rx="10"
            fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.45)" stroke-width="1.25"/>
      <text x="940" y="526">Churn %</text>
    </g>
  </g>

  <!-- Title chip, lower-left -->
  <g transform="translate(60 540)">
    <rect width="260" height="44" rx="22"
          fill="rgba(9,12,32,0.72)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
    <circle cx="22" cy="22" r="5" fill="url(#bp)"/>
    <text x="40" y="29" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="14" font-weight="700" fill="rgba(255,255,255,0.95)"
          letter-spacing="0.4">PowerBI-Lineage</text>
  </g>
</svg>
