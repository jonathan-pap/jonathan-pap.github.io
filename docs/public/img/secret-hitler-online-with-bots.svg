<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Secret Hitler online with AI bots cover">
  <defs>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.25" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="0.8" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="#0B1030"/>
  <rect width="1200" height="630" fill="url(#gA)"/>
  <rect width="1200" height="630" fill="url(#gB)"/>

  <!-- Soft halo behind the action -->
  <ellipse cx="600" cy="335" rx="540" ry="170" fill="url(#bp)" opacity="0.06"/>

  <!-- ============= LEFT: fanned policy-card stack ============= -->
  <!-- back card -->
  <g transform="translate(160 220) rotate(-9)">
    <rect width="220" height="200" rx="14"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
    <!-- art-deco chevron motif -->
    <g transform="translate(110 100)" stroke="rgba(255,255,255,0.18)" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M -40 -16 L 0 -32 L 40 -16"/>
      <path d="M -28 -2 L 0 -16 L 28 -2"/>
      <path d="M -16 12 L 0 -2 L 16 12"/>
    </g>
  </g>

  <!-- middle card -->
  <g transform="translate(180 200) rotate(-3)">
    <rect width="220" height="200" rx="14"
          fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <g transform="translate(110 100)" stroke="rgba(255,255,255,0.32)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M -40 -16 L 0 -32 L 40 -16"/>
      <path d="M -28 -2 L 0 -16 L 28 -2"/>
      <path d="M -16 12 L 0 -2 L 16 12"/>
    </g>
  </g>

  <!-- front card (brand-tinted, "active") -->
  <g transform="translate(200 184)">
    <rect width="220" height="200" rx="14"
          fill="url(#bp)" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>
    <g transform="translate(110 100)" stroke="rgba(255,255,255,0.85)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M -42 -18 L 0 -36 L 42 -18"/>
      <path d="M -30 -4 L 0 -18 L 30 -4"/>
      <path d="M -18 10 L 0 -4 L 18 10"/>
      <path d="M -8 22 L 0 14 L 8 22"/>
    </g>
  </g>

  <!-- ============= MIDDLE: badge + continuous beam + arrow, all on y=300 ============= -->
  <g>
    <!-- continuous beam from front card edge → canvas edge -->
    <line x1="426" y1="300" x2="772" y2="300"
          stroke="rgba(139,92,246,0.55)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- arrowhead -->
    <path d="M 754 286 L 778 300 L 754 314" fill="none"
          stroke="#8B5CF6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- soft halo behind pill -->
    <ellipse cx="600" cy="300" rx="160" ry="46" fill="url(#bp)" opacity="0.18"/>

    <!-- AI bots badge — 244×56, centred at (600, 300) -->
    <g transform="translate(478 272)">
      <rect width="244" height="56" rx="28"
            fill="rgba(9,12,32,0.94)" stroke="rgba(139,92,246,0.7)" stroke-width="1.75"/>

      <!-- bot glyph (head + antenna + eyes), vertically centred -->
      <g transform="translate(28 28)" stroke="url(#bp)" stroke-width="2.2" stroke-linecap="round" fill="none">
        <line x1="0" y1="-16" x2="0" y2="-10"/>
        <circle cx="0" cy="-18" r="2" fill="url(#bp)" stroke="none"/>
        <rect x="-12" y="-10" width="24" height="18" rx="5"/>
        <circle cx="-5" cy="-2" r="1.6" fill="url(#bp)" stroke="none"/>
        <circle cx="5"  cy="-2" r="1.6" fill="url(#bp)" stroke="none"/>
        <line x1="-4" y1="4" x2="4" y2="4"/>
      </g>

      <text x="56" y="35" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
            font-size="18" font-weight="800" fill="rgba(255,255,255,0.96)" letter-spacing="0.2">AI players</text>
    </g>
  </g>

  <!-- ============= RIGHT: policy-track game state ============= -->
  <g transform="translate(770 165)">
    <!-- soft drop -->
    <rect x="6" y="8" width="340" height="300" rx="16"
          fill="rgba(0,0,0,0.35)" filter="url(#soft)"/>

    <!-- canvas frame -->
    <rect width="340" height="300" rx="16"
          fill="#0F1538" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

    <!-- header bar (gradient) -->
    <path d="M 0 16 a 16 16 0 0 1 16 -16 H 324 a 16 16 0 0 1 16 16 V 50 H 0 Z" fill="url(#bp)"/>
    <circle cx="22" cy="25" r="6" fill="rgba(255,255,255,0.85)"/>
    <rect x="38" y="20" width="120" height="10" rx="3" fill="rgba(255,255,255,0.85)"/>

    <!-- ROW 1: 6-slot track, three enacted (brand gradient), three empty -->
    <text x="20" y="78" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="9" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="1.5">TRACK A</text>
    <g>
      <!-- enacted -->
      <rect x="20" y="86" width="44" height="58" rx="6" fill="url(#bp)" stroke="rgba(255,255,255,0.20)"/>
      <g transform="translate(42 115)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round">
        <path d="M -10 -4 L 0 -10 L 10 -4"/>
        <path d="M -8 2 L 0 -4 L 8 2"/>
      </g>

      <rect x="70" y="86" width="44" height="58" rx="6" fill="url(#bp)" stroke="rgba(255,255,255,0.20)"/>
      <g transform="translate(92 115)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round">
        <path d="M -10 -4 L 0 -10 L 10 -4"/>
        <path d="M -8 2 L 0 -4 L 8 2"/>
      </g>

      <rect x="120" y="86" width="44" height="58" rx="6" fill="url(#bp)" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>
      <g transform="translate(142 115)" stroke="rgba(255,255,255,0.85)" stroke-width="1.7" fill="none" stroke-linecap="round">
        <path d="M -11 -4 L 0 -11 L 11 -4"/>
        <path d="M -9 2 L 0 -4 L 9 2"/>
      </g>

      <!-- empty -->
      <rect x="170" y="86" width="44" height="58" rx="6"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="220" y="86" width="44" height="58" rx="6"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="270" y="86" width="44" height="58" rx="6"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="3 3"/>
    </g>

    <!-- ROW 2: 5-slot track, two enacted, three empty (offset to centre under row 1) -->
    <text x="20" y="170" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="9" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="1.5">TRACK B</text>
    <g transform="translate(45 178)">
      <!-- enacted (subtler outline-only treatment so two rows don't look identical) -->
      <rect x="0" y="0" width="44" height="58" rx="6"
            fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.65)" stroke-width="1.5"/>
      <g transform="translate(22 29)" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 -12 L 3 -3 L 12 -3 L 5 3 L 8 12 L 0 7 L -8 12 L -5 3 L -12 -3 L -3 -3 Z"/>
      </g>

      <rect x="50" y="0" width="44" height="58" rx="6"
            fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.65)" stroke-width="1.5"/>
      <g transform="translate(72 29)" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 -12 L 3 -3 L 12 -3 L 5 3 L 8 12 L 0 7 L -8 12 L -5 3 L -12 -3 L -3 -3 Z"/>
      </g>

      <!-- empty -->
      <rect x="100" y="0" width="44" height="58" rx="6"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="150" y="0" width="44" height="58" rx="6"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="200" y="0" width="44" height="58" rx="6"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="3 3"/>
    </g>

    <!-- vote pills (small UI flavour at the bottom) -->
    <g transform="translate(20 252)">
      <text x="0" y="0" font-family="ui-sans-serif" font-size="9" font-weight="700"
            fill="rgba(255,255,255,0.55)" letter-spacing="1.5">VOTE</text>
      <g transform="translate(0 8)">
        <rect width="44" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
        <text x="22" y="15" text-anchor="middle" font-family="ui-sans-serif" font-size="10" font-weight="700"
              fill="rgba(255,255,255,0.75)">JA</text>

        <rect x="50" width="44" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
        <text x="72" y="15" text-anchor="middle" font-family="ui-sans-serif" font-size="10" font-weight="700"
              fill="rgba(255,255,255,0.75)">JA</text>

        <rect x="100" width="44" height="22" rx="11" fill="rgba(139,92,246,0.20)" stroke="rgba(139,92,246,0.55)"/>
        <text x="122" y="15" text-anchor="middle" font-family="ui-sans-serif" font-size="10" font-weight="700"
              fill="rgba(255,255,255,0.92)">NEIN</text>

        <rect x="156" width="44" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
        <text x="178" y="15" text-anchor="middle" font-family="ui-sans-serif" font-size="10" font-weight="700"
              fill="rgba(255,255,255,0.75)">JA</text>

        <rect x="206" width="44" height="22" rx="11" fill="rgba(139,92,246,0.20)" stroke="rgba(139,92,246,0.55)"/>
        <text x="228" y="15" text-anchor="middle" font-family="ui-sans-serif" font-size="10" font-weight="700"
              fill="rgba(255,255,255,0.92)">NEIN</text>
      </g>
    </g>
  </g>

  <!-- ============= Title chip lower-left ============= -->
  <g transform="translate(150 510)">
    <rect width="320" height="48" rx="24"
          fill="rgba(9,12,32,0.78)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="url(#bp)"/>
    <text x="44" y="31" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="15" font-weight="700" fill="rgba(255,255,255,0.96)" letter-spacing="0.4">Secret Hitler — Online</text>
  </g>
</svg>
