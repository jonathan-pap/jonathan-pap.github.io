<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A Pareto chart for Power BI that survives re-sorting">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity=".055"/></pattern>
    <radialGradient id="glow" cx=".82" cy=".18" r=".6"><stop offset="0" stop-color="#5B8BF0" stop-opacity=".30"/><stop offset="1" stop-color="#5B8BF0" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE785"/><stop offset="1" stop-color="#EDB40C"/></linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A1328"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- left: title -->
  <g font-family="Figtree, 'Segoe UI', system-ui, sans-serif">
    <text x="72" y="150" font-family="'IBM Plex Mono', Consolas, monospace" font-size="20" letter-spacing="4" fill="#F2C811">POWER BI · CLAUDE CODE SKILL</text>
    <text x="72" y="250" font-size="78" font-weight="800" fill="#E8ECF5" letter-spacing="-1.5">A Pareto that</text>
    <text x="72" y="336" font-size="78" font-weight="800" fill="url(#gold)" letter-spacing="-1.5">survives sorting.</text>
    <text x="72" y="398" font-size="28" fill="#A3AEC8">One visual calculation, one file,</text>
    <text x="72" y="436" font-size="28" fill="#A3AEC8">and no change to your model.</text>
  </g>

  <!-- left bottom: brand -->
  <g transform="translate(72 520)">
    <g transform="scale(1.6)">
      <path d="M3 16.6 12 21.2 21 16.6" fill="none" stroke="#2A4A8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 12.1 12 16.7 21 12.1" fill="none" stroke="#4069C4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 3 21 7.6 12 12.2 3 7.6Z" fill="url(#gold)" stroke="url(#gold)" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <text x="52" y="27" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#E8ECF5">Gold Layer</text>
  </g>

  <!-- right: the chart on one shared scale; bars teal while the cumulative is within 80%, the line teal up to the crossing -->
  <g transform="translate(760 118)">
    <rect width="400" height="400" rx="18" fill="#10204A" stroke="#FFFFFF" stroke-opacity=".10"/>
    <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="15" fill="#6B7896">
      <text x="352" y="74" text-anchor="end">100%</text>
      <line x1="36" y1="80" x2="364" y2="80" stroke="#FFFFFF" stroke-opacity=".08"/>
      <line x1="36" y1="136" x2="364" y2="136" stroke="#F2C811" stroke-opacity=".35" stroke-dasharray="4 6"/>
      <text x="352" y="130" text-anchor="end" fill="#F2C811" fill-opacity=".8">80%</text>
      <line x1="36" y1="360" x2="364" y2="360" stroke="#FFFFFF" stroke-opacity=".18"/>
    </g>
    <!-- bars: values 100 62 45 30 18 12 8 5 of 280, 280 px = 100% -->
    <g>
      <rect x="44" y="260" width="30" height="100" rx="3" fill="#1E9790"/>
      <rect x="84" y="298" width="30" height="62" rx="3" fill="#1E9790"/>
      <rect x="124" y="315" width="30" height="45" rx="3" fill="#1E9790"/>
      <rect x="164" y="330" width="30" height="30" rx="3" fill="#ED4D55"/>
      <rect x="204" y="342" width="30" height="18" rx="3" fill="#ED4D55"/>
      <rect x="244" y="348" width="30" height="12" rx="3" fill="#ED4D55"/>
      <rect x="284" y="352" width="30" height="8" rx="3" fill="#ED4D55"/>
      <rect x="324" y="355" width="30" height="5" rx="3" fill="#ED4D55"/>
    </g>
    <!-- cumulative: 100 162 207 237 255 267 275 280 -->
    <polyline points="59,260 99,198 139,153 179,123" fill="none" stroke="#1E9790" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="179,123 219,105 259,93 299,85 339,80" fill="none" stroke="#ED4D55" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <g stroke-width="4" fill="#10204A">
      <circle cx="59" cy="260" r="7" stroke="#1E9790"/>
      <circle cx="99" cy="198" r="7" stroke="#1E9790"/>
      <circle cx="139" cy="153" r="7" stroke="#1E9790"/>
      <circle cx="179" cy="123" r="7" stroke="#ED4D55"/>
      <circle cx="219" cy="105" r="7" stroke="#ED4D55"/>
      <circle cx="259" cy="93" r="7" stroke="#ED4D55"/>
      <circle cx="299" cy="85" r="7" stroke="#ED4D55"/>
      <circle cx="339" cy="80" r="7" stroke="#ED4D55"/>
    </g>
  </g>
</svg>
