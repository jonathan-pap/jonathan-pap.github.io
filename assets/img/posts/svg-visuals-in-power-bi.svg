<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="SVG visuals in Power BI, built from reusable parts">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity=".055"/></pattern>
    <radialGradient id="glow" cx=".82" cy=".18" r=".6"><stop offset="0" stop-color="#5B8BF0" stop-opacity=".30"/><stop offset="1" stop-color="#5B8BF0" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE785"/><stop offset="1" stop-color="#EDB40C"/></linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A1328"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- left: title -->
  <g font-family="Figtree, 'Segoe UI', system-ui, sans-serif">
    <text x="72" y="150" font-family="'IBM Plex Mono', Consolas, monospace" font-size="20" letter-spacing="4" fill="#F2C811">POWER BI · DAX · SVG</text>
    <text x="72" y="250" font-size="78" font-weight="800" fill="#E8ECF5" letter-spacing="-1.5">SVG visuals,</text>
    <text x="72" y="336" font-size="78" font-weight="800" fill="url(#gold)" letter-spacing="-1.5">built from parts.</text>
    <text x="72" y="398" font-size="28" fill="#A3AEC8">Variables for the sections,</text>
    <text x="72" y="436" font-size="28" fill="#A3AEC8">functions for the parts you repeat.</text>
  </g>

  <!-- left bottom: brand -->
  <g transform="translate(72 520)">
    <g transform="scale(1.6)">
      <path d="M3 16.6 12 21.2 21 16.6" fill="none" stroke="#2A4A8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 12.1 12 16.7 21 12.1" fill="none" stroke="#4069C4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 3 21 7.6 12 12.2 3 7.6Z" fill="url(#gold)" stroke="url(#gold)" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <text x="52" y="27" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#E8ECF5">Gold Layer</text>
  </g>

  <!-- right: a table whose cells are SVG images: realm, progress to target, variance pill (Realm Chronicle, 2025) -->
  <g transform="translate(760 118)">
    <rect width="400" height="400" rx="18" fill="#10204A" stroke="#FFFFFF" stroke-opacity=".10"/>
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#A3AEC8">
      <text x="24" y="52">Ashfall Reach</text>
      <text x="24" y="102">Emberwaste</text>
      <text x="24" y="152">Frosthollow</text>
      <text x="24" y="202">Gloamspire</text>
      <text x="24" y="252">Hollowmere</text>
      <text x="24" y="302">Saltreach</text>
      <text x="24" y="352">Thornveil</text>
    </g>
    <g>
      <rect x="150" y="40" width="125" height="12" rx="2" fill="#24365F"/><rect x="150" y="40" width="88" height="12" rx="2" fill="#E2564A"/><rect x="249" y="34" width="3" height="24" fill="#E8ECF5"/>
      <rect x="150" y="90" width="125" height="12" rx="2" fill="#24365F"/><rect x="150" y="90" width="94" height="12" rx="2" fill="#E2564A"/><rect x="249" y="84" width="3" height="24" fill="#E8ECF5"/>
      <rect x="150" y="140" width="125" height="12" rx="2" fill="#24365F"/><rect x="150" y="140" width="97" height="12" rx="2" fill="#E2564A"/><rect x="249" y="134" width="3" height="24" fill="#E8ECF5"/>
      <rect x="150" y="190" width="125" height="12" rx="2" fill="#24365F"/><rect x="150" y="190" width="99" height="12" rx="2" fill="#E2564A"/><rect x="249" y="184" width="3" height="24" fill="#E8ECF5"/>
      <rect x="150" y="240" width="125" height="12" rx="2" fill="#24365F"/><rect x="150" y="240" width="98" height="12" rx="2" fill="#E2564A"/><rect x="249" y="234" width="3" height="24" fill="#E8ECF5"/>
      <rect x="150" y="290" width="125" height="12" rx="2" fill="#24365F"/><rect x="150" y="290" width="100" height="12" rx="2" fill="#3FAE74"/><rect x="249" y="284" width="3" height="24" fill="#E8ECF5"/>
      <rect x="150" y="340" width="125" height="12" rx="2" fill="#24365F"/><rect x="150" y="340" width="101" height="12" rx="2" fill="#3FAE74"/><rect x="249" y="334" width="3" height="24" fill="#E8ECF5"/>
    </g>
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="296" y="34" width="80" height="24" rx="12" fill="#E2564A"/><text x="336" y="51">-12%</text>
      <rect x="296" y="84" width="80" height="24" rx="12" fill="#E2564A"/><text x="336" y="101">-6%</text>
      <rect x="296" y="134" width="80" height="24" rx="12" fill="#E2564A"/><text x="336" y="151">-3%</text>
      <rect x="296" y="184" width="80" height="24" rx="12" fill="#E2564A"/><text x="336" y="201">-1%</text>
      <rect x="296" y="234" width="80" height="24" rx="12" fill="#E2564A"/><text x="336" y="251">-2%</text>
      <rect x="296" y="284" width="80" height="24" rx="12" fill="#3FAE74"/><text x="336" y="301">0%</text>
      <rect x="296" y="334" width="80" height="24" rx="12" fill="#3FAE74"/><text x="336" y="351">+1%</text>
    </g>
  </g>
</svg>
