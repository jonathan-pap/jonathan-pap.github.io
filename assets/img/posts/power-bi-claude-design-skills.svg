<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Designing Power BI with Claude as the build partner">
  <defs>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.2" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="#0B1030"/>
  <rect width="1200" height="630" fill="url(#gA)"/>
  <rect width="1200" height="630" fill="url(#gB)"/>

  <!-- Left: stack of skill-folder cards -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="14" font-weight="600" fill="rgba(255,255,255,0.92)">

    <!-- card 4 (back) -->
    <g transform="translate(70 200) rotate(-3)">
      <rect width="280" height="64" rx="12"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
      <text x="20" y="29" font-size="10" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="0.6">SKILL · DAX UDF</text>
      <text x="20" y="50">dax-udf/</text>
    </g>

    <!-- card 3 -->
    <g transform="translate(60 160) rotate(-1)">
      <rect width="280" height="64" rx="12"
            fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="20" y="29" font-size="10" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="0.6">SKILL · CALC GROUPS</text>
      <text x="20" y="50">calc-groups/</text>
    </g>

    <!-- card 2 -->
    <g transform="translate(70 120)">
      <rect width="280" height="64" rx="12"
            fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)"/>
      <text x="20" y="29" font-size="10" font-weight="700" fill="rgba(255,255,255,0.6)" letter-spacing="0.6">SKILL · MEASURES</text>
      <text x="20" y="50">measures/</text>
    </g>

    <!-- card 1 (front, brand-tinted) -->
    <g transform="translate(80 80)">
      <rect width="280" height="64" rx="12"
            fill="url(#bp)" stroke="rgba(255,255,255,0.22)"/>
      <text x="20" y="29" font-size="10" font-weight="800" fill="rgba(255,255,255,0.92)" letter-spacing="0.6">SKILL · TMDL STANDARDS</text>
      <text x="20" y="50" fill="#fff">tmdl-standards/</text>
    </g>

    <!-- design-system stack (lower) -->
    <g transform="translate(80 360)">
      <rect width="280" height="56" rx="12"
            fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="20" y="26" font-size="10" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="0.6">SKILL · DESIGN SYSTEM</text>
      <text x="20" y="46">design-system/</text>
    </g>

    <g transform="translate(70 410)">
      <rect width="280" height="48" rx="12"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
      <text x="20" y="26" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="0.6">design-system / iconography/</text>
    </g>

    <g transform="translate(60 450)">
      <rect width="280" height="48" rx="12"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
      <text x="20" y="26" font-size="10" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="0.6">design-system / wordmark/</text>
    </g>
  </g>

  <!-- Middle: beam + Claude badge -->
  <g>
    <line x1="380" y1="315" x2="780" y2="315"
          stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>
    <!-- arrowhead -->
    <path d="M 770 305 L 790 315 L 770 325" fill="none"
          stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Claude badge -->
    <g transform="translate(495 285)">
      <rect width="170" height="60" rx="30"
            fill="rgba(9,12,32,0.85)" stroke="rgba(139,92,246,0.6)" stroke-width="1.5"/>
      <!-- sparkle -->
      <g transform="translate(28 30)" stroke="url(#bp)" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M 0 -10 L 0 10 M -10 0 L 10 0"/>
        <path d="M -7 -7 L 7 7 M -7 7 L 7 -7" stroke-opacity="0.55"/>
      </g>
      <text x="60" y="28" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
            font-size="14" font-weight="800" fill="rgba(255,255,255,0.96)">Claude.ai</text>
      <text x="60" y="46" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
            font-size="11" font-weight="500" fill="rgba(255,255,255,0.66)">Design Studio</text>
    </g>
  </g>

  <!-- Right: stylized Power BI report canvas -->
  <g transform="translate(790 95)">
    <!-- canvas frame -->
    <rect width="350" height="440" rx="14"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>

    <!-- header bar -->
    <rect x="0" y="0" width="350" height="44" rx="14"
          fill="url(#bp)" opacity="0.85"/>
    <rect x="0" y="20" width="350" height="24"
          fill="url(#bp)" opacity="0.85"/>
    <text x="20" y="28" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="13" font-weight="700" fill="#fff" letter-spacing="0.3">Sales Overview</text>

    <!-- 3 KPI cards row -->
    <g font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif">
      <g transform="translate(16 60)">
        <rect width="100" height="64" rx="8"
              fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
        <text x="10" y="22" font-size="9" font-weight="600" fill="rgba(255,255,255,0.55)" letter-spacing="0.4">$ REVENUE</text>
        <text x="10" y="44" font-size="18" font-weight="800" fill="rgba(255,255,255,0.95)">$ 4.2M</text>
        <text x="10" y="58" font-size="9" font-weight="600" fill="#9ae6b4">▲ 12.4%</text>
      </g>
      <g transform="translate(125 60)">
        <rect width="100" height="64" rx="8"
              fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
        <text x="10" y="22" font-size="9" font-weight="600" fill="rgba(255,255,255,0.55)" letter-spacing="0.4"># ORDERS</text>
        <text x="10" y="44" font-size="18" font-weight="800" fill="rgba(255,255,255,0.95)">12,840</text>
        <text x="10" y="58" font-size="9" font-weight="600" fill="#9ae6b4">▲ 8.1%</text>
      </g>
      <g transform="translate(234 60)">
        <rect width="100" height="64" rx="8"
              fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
        <text x="10" y="22" font-size="9" font-weight="600" fill="rgba(255,255,255,0.55)" letter-spacing="0.4">% MARGIN</text>
        <text x="10" y="44" font-size="18" font-weight="800" fill="rgba(255,255,255,0.95)">38.6%</text>
        <text x="10" y="58" font-size="9" font-weight="600" fill="#f5a97f">▼ 1.2%</text>
      </g>
    </g>

    <!-- column chart -->
    <g transform="translate(16 144)">
      <rect width="209" height="160" rx="8"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
      <text x="12" y="20" font-family="ui-sans-serif" font-size="10" font-weight="600"
            fill="rgba(255,255,255,0.65)" letter-spacing="0.4">REVENUE BY MONTH</text>
      <g fill="url(#bp)" opacity="0.9">
        <rect x="14" y="120" width="14" height="22"/>
        <rect x="34" y="100" width="14" height="42"/>
        <rect x="54" y="84"  width="14" height="58"/>
        <rect x="74" y="68"  width="14" height="74"/>
        <rect x="94" y="56"  width="14" height="86"/>
        <rect x="114" y="78" width="14" height="64"/>
        <rect x="134" y="64" width="14" height="78"/>
        <rect x="154" y="48" width="14" height="94"/>
        <rect x="174" y="40" width="14" height="102"/>
      </g>
    </g>

    <!-- line chart -->
    <g transform="translate(234 144)">
      <rect width="100" height="160" rx="8"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
      <text x="10" y="20" font-family="ui-sans-serif" font-size="10" font-weight="600"
            fill="rgba(255,255,255,0.65)" letter-spacing="0.4">YOY %</text>
      <path d="M 12 130 L 28 110 L 44 100 L 60 80 L 76 60 L 92 40"
            fill="none" stroke="url(#bp)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="92" cy="40" r="3" fill="#8B5CF6"/>
    </g>

    <!-- table -->
    <g transform="translate(16 320)">
      <rect width="318" height="100" rx="8"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
      <text x="12" y="20" font-family="ui-sans-serif" font-size="10" font-weight="600"
            fill="rgba(255,255,255,0.65)" letter-spacing="0.4">TOP STORES</text>
      <g font-family="ui-sans-serif" font-size="10" fill="rgba(255,255,255,0.78)">
        <text x="12" y="40">Store 12</text> <text x="240" y="40" text-anchor="end">$ 1.1M</text>
        <text x="12" y="60">Store 04</text> <text x="240" y="60" text-anchor="end">$ 0.9M</text>
        <text x="12" y="80">Store 07</text> <text x="240" y="80" text-anchor="end">$ 0.7M</text>
      </g>
      <line x1="12" y1="46" x2="306" y2="46" stroke="rgba(255,255,255,0.06)"/>
      <line x1="12" y1="66" x2="306" y2="66" stroke="rgba(255,255,255,0.06)"/>
    </g>
  </g>

  <!-- Title chip lower-left -->
  <g transform="translate(60 555)">
    <rect width="380" height="44" rx="22"
          fill="rgba(9,12,32,0.78)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
    <circle cx="22" cy="22" r="5" fill="url(#bp)"/>
    <text x="40" y="29" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="14" font-weight="700" fill="rgba(255,255,255,0.95)" letter-spacing="0.4">PowerBI-Claude-Design</text>
  </g>
</svg>
