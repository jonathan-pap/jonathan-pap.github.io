<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Designing Power BI with Claude Design as the build partner">
  <defs>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.25" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="0.8" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="#0B1030"/>
  <rect width="1200" height="630" fill="url(#gA)"/>
  <rect width="1200" height="630" fill="url(#gB)"/>

  <!-- Soft halo behind the action -->
  <ellipse cx="600" cy="335" rx="540" ry="170" fill="url(#bp)" opacity="0.06"/>

  <!-- ============= LEFT: stack of 3 markdown documents ============= -->
  <!-- back card -->
  <g transform="translate(150 220) rotate(-6)">
    <rect width="240" height="200" rx="16"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
    <g stroke="rgba(255,255,255,0.18)" stroke-width="2.2" stroke-linecap="round">
      <line x1="22" y1="34" x2="180" y2="34"/>
      <line x1="22" y1="60" x2="160" y2="60"/>
      <line x1="22" y1="86" x2="200" y2="86"/>
      <line x1="22" y1="112" x2="170" y2="112"/>
      <line x1="22" y1="138" x2="190" y2="138"/>
      <line x1="22" y1="164" x2="130" y2="164"/>
    </g>
  </g>

  <!-- middle card -->
  <g transform="translate(170 200) rotate(-2)">
    <rect width="240" height="200" rx="16"
          fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <g stroke="rgba(255,255,255,0.32)" stroke-width="2.4" stroke-linecap="round">
      <line x1="22" y1="34" x2="180" y2="34"/>
      <line x1="22" y1="60" x2="160" y2="60"/>
      <line x1="22" y1="86" x2="200" y2="86"/>
      <line x1="22" y1="112" x2="170" y2="112"/>
      <line x1="22" y1="138" x2="190" y2="138"/>
      <line x1="22" y1="164" x2="130" y2="164"/>
    </g>
  </g>

  <!-- front card (brand-tinted, "active") -->
  <g transform="translate(190 184)">
    <rect width="240" height="200" rx="16"
          fill="url(#bp)" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>
    <g stroke="rgba(255,255,255,0.85)" stroke-width="2.6" stroke-linecap="round">
      <line x1="22" y1="34" x2="100" y2="34" stroke-width="3.5"/>
      <line x1="22" y1="60" x2="200" y2="60"/>
      <line x1="22" y1="86" x2="170" y2="86"/>
      <line x1="22" y1="112" x2="190" y2="112"/>
      <line x1="22" y1="138" x2="155" y2="138"/>
      <line x1="22" y1="164" x2="180" y2="164"/>
    </g>
  </g>

  <!-- ============= MIDDLE: badge + continuous beam + arrow, all on y=300 ============= -->
  <g>
    <!-- One continuous beam from front doc edge to canvas edge.
         Solid colour (not gradient) so it stays visible across the
         whole length. The pill sits on top of it. -->
    <line x1="430" y1="300" x2="772" y2="300"
          stroke="rgba(139,92,246,0.55)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Arrowhead at the right end — bigger, bolder, clearly the terminus -->
    <path d="M 754 286 L 778 300 L 754 314" fill="none"
          stroke="#8B5CF6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Soft halo behind the pill so it pops above the beam -->
    <ellipse cx="600" cy="300" rx="160" ry="46" fill="url(#bp)" opacity="0.18"/>

    <!-- Claude Design badge — centred at (600, 300). Pill 244×56, sits ON TOP of the beam. -->
    <g transform="translate(478 272)">
      <rect width="244" height="56" rx="28"
            fill="rgba(9,12,32,0.94)" stroke="rgba(139,92,246,0.7)" stroke-width="1.75"/>
      <!-- sparkle, vertically centred (pill centre y = 28) -->
      <g transform="translate(28 28)" stroke="url(#bp)" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M 0 -10 L 0 10 M -10 0 L 10 0"/>
        <path d="M -7 -7 L 7 7 M -7 7 L 7 -7" stroke-opacity="0.55"/>
      </g>
      <!-- text, baseline aligned with sparkle centreline -->
      <text x="52" y="35" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
            font-size="18" font-weight="800" fill="rgba(255,255,255,0.96)" letter-spacing="0.2">Claude Design</text>
    </g>
  </g>

  <!-- ============= RIGHT: Power BI canvas ============= -->
  <g transform="translate(770 165)">
    <!-- soft drop -->
    <rect x="6" y="8" width="340" height="300" rx="16"
          fill="rgba(0,0,0,0.35)" filter="url(#soft)"/>
    <!-- canvas frame -->
    <rect width="340" height="300" rx="16"
          fill="#0F1538" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

    <!-- header bar (gradient) -->
    <path d="M 0 16 a 16 16 0 0 1 16 -16 H 324 a 16 16 0 0 1 16 16 V 50 H 0 Z" fill="url(#bp)"/>
    <circle cx="22" cy="25" r="6" fill="rgba(255,255,255,0.85)"/>
    <rect x="38" y="20" width="120" height="10" rx="3" fill="rgba(255,255,255,0.85)"/>

    <!-- 3 KPI cards row -->
    <g>
      <rect x="20" y="68" width="93" height="60" rx="10"
            fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <rect x="30" y="80" width="42" height="6" rx="2" fill="rgba(255,255,255,0.45)"/>
      <rect x="30" y="94" width="55" height="14" rx="3" fill="rgba(255,255,255,0.92)"/>
      <rect x="30" y="115" width="34" height="6" rx="2" fill="#9ae6b4"/>
    </g>
    <g>
      <rect x="123" y="68" width="93" height="60" rx="10"
            fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <rect x="133" y="80" width="42" height="6" rx="2" fill="rgba(255,255,255,0.45)"/>
      <rect x="133" y="94" width="60" height="14" rx="3" fill="rgba(255,255,255,0.92)"/>
      <rect x="133" y="115" width="30" height="6" rx="2" fill="#9ae6b4"/>
    </g>
    <g>
      <rect x="226" y="68" width="93" height="60" rx="10"
            fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <rect x="236" y="80" width="42" height="6" rx="2" fill="rgba(255,255,255,0.45)"/>
      <rect x="236" y="94" width="50" height="14" rx="3" fill="rgba(255,255,255,0.92)"/>
      <rect x="236" y="115" width="32" height="6" rx="2" fill="#f5a97f"/>
    </g>

    <!-- column chart -->
    <g>
      <rect x="20" y="140" width="200" height="140" rx="10"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="30" y="150" width="60" height="6" rx="2" fill="rgba(255,255,255,0.45)"/>
      <g fill="url(#bp)" opacity="0.95">
        <rect x="32" y="248" width="14" height="22" rx="2"/>
        <rect x="52" y="226" width="14" height="44" rx="2"/>
        <rect x="72" y="208" width="14" height="62" rx="2"/>
        <rect x="92" y="186" width="14" height="84" rx="2"/>
        <rect x="112" y="170" width="14" height="100" rx="2"/>
        <rect x="132" y="194" width="14" height="76" rx="2"/>
        <rect x="152" y="174" width="14" height="96" rx="2"/>
        <rect x="172" y="158" width="14" height="112" rx="2"/>
        <rect x="192" y="148" width="14" height="122" rx="2"/>
      </g>
    </g>

    <!-- line chart -->
    <g>
      <rect x="230" y="140" width="90" height="140" rx="10"
            fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
      <rect x="240" y="150" width="40" height="6" rx="2" fill="rgba(255,255,255,0.45)"/>
      <path d="M 240 250 L 256 232 L 272 220 L 288 198 L 304 175 L 314 158"
            fill="none" stroke="url(#bp)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="314" cy="158" r="4" fill="#8B5CF6"/>
    </g>
  </g>

  <!-- ============= Title chip lower-left ============= -->
  <g transform="translate(150 510)">
    <rect width="380" height="48" rx="24"
          fill="rgba(9,12,32,0.78)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="url(#bp)"/>
    <text x="44" y="31" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="15" font-weight="700" fill="rgba(255,255,255,0.96)" letter-spacing="0.4">PowerBI-Claude-Design</text>
  </g>
</svg>
