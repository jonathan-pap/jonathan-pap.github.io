<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Secret Hitler online with bots cover">
  <defs>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="fascist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c1d1d"/>
      <stop offset="1" stop-color="#a32626"/>
    </linearGradient>
    <linearGradient id="liberal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#1e60c8"/>
    </linearGradient>
    <radialGradient id="gA" cx="0.2" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a32626" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a32626" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="#0B1030"/>
  <rect width="1200" height="630" fill="url(#gA)"/>
  <rect width="1200" height="630" fill="url(#gB)"/>

  <!-- ============= FASCIST POLICY TRACK (top row, 6 slots) ============= -->
  <g transform="translate(180 200)">
    <text x="0" y="-18" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="11" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,0.55)">FASCIST POLICIES</text>

    <!-- 6 slots, slot size 130×80, gap 14 -->
    <!-- slots 1-3: enacted (red cards) -->
    <g>
      <rect x="0" y="0" width="130" height="80" rx="10" fill="url(#fascist)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- art-deco eagle simplified: chevrons -->
      <g stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" transform="translate(65 40)">
        <path d="M -22 -8 L 0 -16 L 22 -8"/>
        <path d="M -16 0 L 0 -8 L 16 0"/>
        <path d="M -10 8 L 0 0 L 10 8"/>
      </g>
    </g>
    <g transform="translate(144 0)">
      <rect width="130" height="80" rx="10" fill="url(#fascist)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <g stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" transform="translate(65 40)">
        <path d="M -22 -8 L 0 -16 L 22 -8"/>
        <path d="M -16 0 L 0 -8 L 16 0"/>
        <path d="M -10 8 L 0 0 L 10 8"/>
      </g>
    </g>
    <g transform="translate(288 0)">
      <!-- glowing — most recent enacted -->
      <ellipse cx="65" cy="40" rx="100" ry="45" fill="url(#halo)"/>
      <rect width="130" height="80" rx="10" fill="url(#fascist)" stroke="rgba(255,180,180,0.55)" stroke-width="2"/>
      <g stroke="rgba(255,255,255,0.55)" stroke-width="1.6" fill="none" transform="translate(65 40)">
        <path d="M -22 -8 L 0 -16 L 22 -8"/>
        <path d="M -16 0 L 0 -8 L 16 0"/>
        <path d="M -10 8 L 0 0 L 10 8"/>
      </g>
    </g>

    <!-- slots 4-6: empty -->
    <g transform="translate(432 0)">
      <rect width="130" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>
    <g transform="translate(576 0)">
      <rect width="130" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <!-- exec-power marker (Execution) -->
      <circle cx="65" cy="40" r="9" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>
      <path d="M 60 35 L 70 45 M 70 35 L 60 45" stroke="rgba(255,255,255,0.30)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(720 0)">
      <rect width="130" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>
  </g>

  <!-- ============= LIBERAL POLICY TRACK (bottom row, 5 slots) ============= -->
  <g transform="translate(252 340)">
    <text x="0" y="-18" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="11" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,0.55)">LIBERAL POLICIES</text>

    <!-- 5 slots, same size + gap as above so they nest visually -->
    <!-- slots 1-2: enacted -->
    <g>
      <rect width="130" height="80" rx="10" fill="url(#liberal)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <g stroke="rgba(255,255,255,0.45)" stroke-width="1.5" fill="none" transform="translate(65 40)">
        <circle cx="0" cy="0" r="14"/>
        <path d="M 0 -22 L 4 -10 L 16 -10 L 6 -2 L 10 10 L 0 4 L -10 10 L -6 -2 L -16 -10 L -4 -10 Z" stroke-opacity="0.6"/>
      </g>
    </g>
    <g transform="translate(144 0)">
      <rect width="130" height="80" rx="10" fill="url(#liberal)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <g stroke="rgba(255,255,255,0.45)" stroke-width="1.5" fill="none" transform="translate(65 40)">
        <circle cx="0" cy="0" r="14"/>
        <path d="M 0 -22 L 4 -10 L 16 -10 L 6 -2 L 10 10 L 0 4 L -10 10 L -6 -2 L -16 -10 L -4 -10 Z" stroke-opacity="0.6"/>
      </g>
    </g>

    <!-- slots 3-5: empty -->
    <g transform="translate(288 0)">
      <rect width="130" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>
    <g transform="translate(432 0)">
      <rect width="130" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="4 4"/>
    </g>
    <g transform="translate(576 0)">
      <rect width="130" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <!-- final-slot star (liberal win) -->
      <g transform="translate(65 40)" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.30)" stroke-width="1.5">
        <path d="M 0 -14 L 4 -4 L 14 -4 L 6 2 L 9 12 L 0 6 L -9 12 L -6 2 L -14 -4 L -4 -4 Z"/>
      </g>
    </g>
  </g>

  <!-- ============= BOT BADGE (lower-right of the track area) ============= -->
  <g transform="translate(900 470)">
    <!-- soft drop -->
    <rect x="6" y="6" width="200" height="68" rx="34" fill="rgba(0,0,0,0.45)" filter="url(#soft)"/>

    <rect width="200" height="68" rx="34"
          fill="rgba(9,12,32,0.92)" stroke="rgba(139,92,246,0.7)" stroke-width="1.75"/>

    <!-- bot icon (rounded head + antenna + eyes) -->
    <g transform="translate(36 34)" stroke="url(#bp)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <!-- antenna -->
      <line x1="0" y1="-22" x2="0" y2="-14"/>
      <circle cx="0" cy="-24" r="2.5" fill="url(#bp)" stroke="none"/>
      <!-- head -->
      <rect x="-15" y="-14" width="30" height="22" rx="6"/>
      <!-- eyes -->
      <circle cx="-6" cy="-3" r="2" fill="url(#bp)" stroke="none"/>
      <circle cx="6" cy="-3" r="2" fill="url(#bp)" stroke="none"/>
      <!-- mouth -->
      <line x1="-5" y1="3" x2="5" y2="3"/>
    </g>

    <text x="68" y="32" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="13" font-weight="700" fill="rgba(255,255,255,0.95)" letter-spacing="0.4">AI players</text>
    <text x="68" y="50" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="11" font-weight="500" fill="rgba(255,255,255,0.62)">to fill the empty seats</text>
  </g>

  <!-- ============= Title chip lower-left ============= -->
  <g transform="translate(60 540)">
    <rect width="320" height="48" rx="24"
          fill="rgba(9,12,32,0.78)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="url(#bp)"/>
    <text x="44" y="31" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif"
          font-size="15" font-weight="700" fill="rgba(255,255,255,0.96)" letter-spacing="0.4">Secret Hitler — Online</text>
  </g>
</svg>
